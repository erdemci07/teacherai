name: Validate TeacherAI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python -m ruff check apps/api scripts
      - run: python -m scripts.evaluate_models validate
      - run: python -m scripts.answer_key validate
      - run: python -m scripts.education_contracts --check
      - run: python -m scripts.integrity_matrix --check
      - run: python -m scripts.science_matrix --check
      - run: python -m scripts.question_pack --check
      - run: python -m scripts.math_matrix --check
      - run: python -m scripts.anthropic_schema_compat --check
      - run: python -m scripts.curriculum_registry --check
      - run: python -m scripts.knowledge_registry --check
      - run: python -m scripts.dataset_manifest --check
      - run: python -m scripts.teacher_contributions validate-all
      - run: python -m scripts.teacher_contributions status
      - run: python -m scripts.teacher_contributions snapshot --check
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 (node24)
        with:
          distribution: temurin
          java-version: "21"
      - name: Run offline provider tests with local Firestore
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/firestore.jar"
          curl -fsSL --retry 3 https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar -o "$jar"
          echo "9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  $jar" | sha256sum -c -
          java -jar "$jar" --host 127.0.0.1 --port 8789 --project_id demo-teacherai > "$RUNNER_TEMP/firestore.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8789/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/ >/dev/null
          python -m pytest -q apps/api/tests
