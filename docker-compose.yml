services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    command: npm run dev --workspace @teacherai/web
    environment:
      NEXT_PUBLIC_TEACHERAI_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      TEACHERAI_ENVIRONMENT: development
      TEACHERAI_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./apps:/app/apps
