[project]
name = "teacherai-api"
version = "0.1.0"
description = "TeacherAI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "openai>=1.99,<3.0",
  "pillow>=11.3,<13.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
