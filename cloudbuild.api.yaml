# TA-005: proje kimliği Cloud Build'in yerleşik $PROJECT_ID değişkeninden gelir (gcloud builds submit --project).
# TA-005B: bölge ve etiket sabit değildir; scripts/deploy_plan.py bunları --substitutions=_REGION=…,_TAG=… ile verir
# ve Cloud Run'a etiketle değil, bu build'in ürettiği digest ile dağıtır. MUST_MATCH eksik değişkende build'i durdurur.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-f",
        "docker/api/Dockerfile",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/teacherai/teacherai-api:${_TAG}",
        "."
      ]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/teacherai/teacherai-api:${_TAG}"

options:
  substitutionOption: MUST_MATCH
