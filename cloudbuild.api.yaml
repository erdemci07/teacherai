# TA-005: proje kimliği Cloud Build'in yerleşik $PROJECT_ID değişkeninden gelir (gcloud builds submit --project).
substitutions:
  _REGION: "us-east4"
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-f",
        "docker/api/Dockerfile",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/teacherai/teacherai-api:latest",
        "."
      ]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/teacherai/teacherai-api:latest"
